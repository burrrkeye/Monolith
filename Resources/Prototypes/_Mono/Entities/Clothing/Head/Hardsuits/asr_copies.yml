- type: entity
  parent: ClothingHeadHelmetHardsuitSyndie
  id: ClothingHeadHelmetHardsuitAshen
  name: PDV CV-32 combat tacsuit helmet
  description: A combat tacsuit designed in the Phaethon Dynasty.
  components:
  - type: Sprite
    sprite: _Mono/Clothing/Head/Hardsuits/syndicate.rsi
  - type: Clothing
    sprite: _Mono/Clothing/Head/Hardsuits/syndicate.rsi

- type: entity
  parent: ClothingHeadHelmetHardsuitSyndieElite
  id: ClothingHeadHelmetHardsuitAshenElite
  name: PDV CV-53 combat hardsuit helmet
  description: Based off of the CV-32, sacrifices combat protection for environment protection.
  components:
  - type: Sprite
    sprite: _Mono/Clothing/Head/Hardsuits/syndieelite.rsi
  - type: Clothing
    sprite: _Mono/Clothing/Head/Hardsuits/syndieelite.rsi

- type: entity
  parent: [ClothingHeadHelmetHardsuitSyndieElite, ShowSecurityIcons]
  id: ClothingHeadHelmetHardsuitVizier
  name: PDV CV-67 combat hardsuit helmet
  description: An adorned tacsuit designed with an imperfect nanolaminate composition. High maneuverability, sturdy armor.
  components:
  - type: Sprite
    sprite: _Mono/Clothing/Head/Hardsuits/pdv_vizier.rsi
  - type: Clothing
    sprite: _Mono/Clothing/Head/Hardsuits/pdv_vizier.rsi

- type: entity
  parent: [ClothingHeadHelmetHardsuitSyndieElite, ShowSecurityIcons]
  id: ClothingHeadHelmetHardsuitPDVStellic
  name: PDV CV-53-S combat hardsuit helmet
  description: Based off of the CV-53, outfitted with imperfect nanomalite composition for better protection.
  components:
  - type: Sprite
    sprite: _Mono/Clothing/Head/Hardsuits/pdv_stellic.rsi
  - type: Clothing
    sprite: _Mono/Clothing/Head/Hardsuits/pdv_stellic.rsi
  - type: ThermalVision
    activateSound: null
    deactivateSound: null
    isEquipment: true
    color: "#fc8383"
    lightRadius: 15
  - type: HideLayerClothing
    slots:
    - Hair
    - Snout
    - HeadTop
    - HeadSide
  - type: RadarConsole
    followEntity: true
  - type: ActivatableUI
    key: enum.RadarConsoleUiKey.Key
    singleUser: true
  - type: UserInterface
    interfaces:
      enum.RadarConsoleUiKey.Key:
        type: RadarConsoleBoundUserInterface
  
- type: entity
  parent: [ClothingHeadHelmetHardsuitSyndieElite, ShowSecurityIcons]
  id: ClothingHeadHelmetHardsuitPDVStellicMedic
  name: PDV CV-53-S-M combat hardsuit helmet
  description: Based off of the CV-53-S, outfitted an inbuilt health visor.
  components:
  - type: Sprite
    sprite: _Mono/Clothing/Head/Hardsuits/pdv_stellic_medic.rsi
  - type: Clothing
    sprite: _Mono/Clothing/Head/Hardsuits/pdv_stellic_medic.rsi
  - type: ThermalVision
    activateSound: null
    deactivateSound: null
    isEquipment: true
    color: "#00ffee"
    lightRadius: 15
  - type: ShowHealthBars
  - type: HideLayerClothing
    slots:
    - Hair
    - Snout
    - HeadTop
    - HeadSide
  - type: RadarConsole
    followEntity: true
  - type: ActivatableUI
    key: enum.RadarConsoleUiKey.Key
    singleUser: true
  - type: UserInterface
    interfaces:
      enum.RadarConsoleUiKey.Key:
        type: RadarConsoleBoundUserInterface
