# ye :)
- type: entity
  parent: MobHuman
  id: MobHumanDComBase
  name: rifleman base
  suffix: Human, Base
  components:
  - type: RandomHumanoidAppearance
    randomizeName: True
  - type: HumanoidAppearance
    height: 1.0
    width: 1.0
  - type: Loadout
    prototypes: [DComRiflemanGear]
    roleLoadout: [RoleSurvivalTankOnly]
  - type: GhostRole
    name: ghost-role-information-dcom-rifleman-name
    description: ghost-role-information-dcom-description
    rules: ghost-role-information-dcom-rules
    raffle:
      settings: short
  - type: GhostTakeoverAvailable
  - type: RandomMetadata
    nameSegments:
    - NamesFirstMilitary
    - NamesLastMilitary
  - type: NpcFactionMember
    factions:
    - PDV
  - type: Company
    companyName: PDV
  - type: SurgerySpeedModifier
    speedModifier: 1.5

- type: roleLoadout
  id: RoleSurvivalTankOnly
  groups:
  - GroupEVATank

