# ye :)
- type: entity
  parent: MobHuman
  id: MobHumanSCBase
  name: stellic commando base
  suffix: Human, Base
  components:
  - type: RandomHumanoidAppearance
    randomizeName: True
  - type: HumanoidAppearance
    height: 1.0
    width: 1.0
  - type: Loadout
    prototypes: [SCRiflemanGear]
    roleLoadout: [RoleSurvivalTankOnly]
  - type: GhostRole
    name: ghost-role-information-sc-name
    description: ghost-role-information-sc-description
    rules: ghost-role-information-sc-rules
    raffle:
      settings: short
  - type: GhostTakeoverAvailable
  - type: RandomMetadata
    nameSegments:
    - NamesFirstMilitary
    - NamesLastMilitary
  - type: NpcFactionMember
    factions:
    - NFPirates
  - type: Company
    companyName: PDV
  - type: SurgerySpeedModifier
    speedModifier: 1.5

- type: roleLoadout
  id: RoleSurvivalTankOnly
  groups:
  - GroupEVATank

